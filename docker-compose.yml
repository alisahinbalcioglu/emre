# ═════════════════════════════════════════════════════════════════
#  MetaPrice — Tek sunucu (VPS) docker-compose
# ═════════════════════════════════════════════════════════════════
#  Tum sistem tek kutuda:
#    caddy      → 80/443, otomatik HTTPS, reverse proxy
#    frontend   → Next.js  (ic port 3000)
#    backend    → NestJS   (ic port 3001, /api)
#    dwg-engine → Python   (ic port 10000, sadece ic ag)
#    db         → Postgres 16 (kalici volume)
#    backup     → gunluk pg_dump (14 gun saklar)
#
#  Kurulum:  cp .env.example .env  → degerleri doldur → docker compose up -d --build
# ═════════════════════════════════════════════════════════════════

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dwg-engine:
    build:
      context: ./backend/src/modules/dwg-engine/python
      args:
        # Motorun da surum damgasi OLMALI. Yoksa /health "local" doner ve
        # deploy dogrulamasi motorun eski kalip kalmadigini ANLAYAMAZ —
        # 11.08'de tam olarak bu yasandi: backend+frontend yenilendi, motor
        # ESKI imajda kaldi, birim tespiti canliya hic cikmadi.
        BUILD_SHA: ${BUILD_SHA:-local}
    restart: unless-stopped
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      PORT: "10000"
      WORKERS: "1"
      PYTHONUNBUFFERED: "1"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # DWG cache omru (saniye). Manuel etiketleme saatler surebilir — 24 saat.
      DWG_CACHE_TTL: "86400"
    volumes:
      # KALICI CACHE: /tmp'deki dwg_cache_* dosyalari (DXF + geometri + state)
      # artik container rebuild/deploy'da SILINMEZ — kullanicinin acik oturumu
      # deploy yuzunden "file_id bilinmiyor"a dusmez. TTL temizligi ayni calisir.
      - dwg_cache:/tmp
    expose:
      - "10000"

  backend:
    build:
      context: ./backend
      args:
        # PK2: canli surum teyidi. `scripts/deploy.sh` bunu git'ten doldurur;
        # elle `docker compose build` calistirilirsa "local" kalir (zararsiz,
        # yalniz /api/health hash yerine "local" doner).
        BUILD_SHA: ${BUILD_SHA:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: "7d"
      # Ayni domain ama tarayici same-origin POST'ta bile Origin header yolluyor.
      # main.ts allowlist'i env'den okur — domaini eklemezsek login reddedilir.
      CORS_ORIGINS: https://${DOMAIN},https://www.${DOMAIN}
      # Ic ag: http (https DEGIL) + servis adi. service.ts DWG_ENGINE_URL'i oldugu gibi kullanir.
      DWG_ENGINE_URL: http://dwg-engine:10000
      DWG_ENGINE_TOKEN: ${INTERNAL_API_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # ── ADIM 2 · ODEME / ABONELIK ────────────────────────────────────
      # ⚠ HER DEGISKEN IKI YERE YAZILIR: burasi (konteynere gecirir) VE
      # sunucudaki `.env` (degeri saglar). Yalniz .env'e yazmak YETMEZ —
      # compose bu blokta anmadigi degiskeni konteynere GECIRMEZ ve
      # uygulama onu HIC gormez.
      #
      # ⚠ HICBIRI ZORUNLU DEGIL: eksikse uygulama ONYUKLENIR, yalnizca
      # odeme uclari 503 doner (bkz. src/ozellik/odeme/yapilandirma.ts).
      # Bu bilincli — odeme yapilandirmasi tum urunu rehin almamali.
      IYZICO_API_KEY: ${IYZICO_API_KEY:-}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-}
      # Panelden alinan uye isyeri numarasi (MID). Webhook GOVDESINDE
      # GELMEZ; imza hesabi bunu ortamdan okur. Yanlissa imza HIC tutmaz —
      # imza uyusmazliginin en olasi sebebi budur.
      IYZICO_MERCHANT_ID: ${IYZICO_MERCHANT_ID:-}
      # Sandbox: https://sandbox-api.iyzipay.com · Canli: https://api.iyzipay.com
      IYZICO_TABAN_URL: ${IYZICO_TABAN_URL:-https://sandbox-api.iyzipay.com}
      # ⚠ ILK GERCEK WEBHOOK'A KADAR "false" KALIR. true yapilirsa ve imza
      # tutmazsa her olay sessizce dusulur. Once gunlukte
      # `IYZICO_IMZA_SIRASI=... olarak sabitleyin` satirini gorun.
      IYZICO_IMZA_ZORUNLU: ${IYZICO_IMZA_ZORUNLU:-false}
      # Dokuman celiskisi: duz metin bir sira, dort kod ornegi baska sira
      # veriyor. Kod ikisini de hesaplar; tutani gunluge basar. Ogrenince
      # buraya yazin (merchantId-once | secretKey-once), sonra tek sira denenir.
      IYZICO_IMZA_SIRASI: ${IYZICO_IMZA_SIRASI:-}
      # Dunning e-postalarindaki baglantilarin koku.
      UYGULAMA_URL: ${UYGULAMA_URL:-https://${DOMAIN}}
      YONETIM_EPOSTA: ${YONETIM_EPOSTA:-}
      KDV_ORANI: ${KDV_ORANI:-20}
      # Dunning merdiveni (gun, basarisiz tahsilattan itibaren).
      # Taahhut sektorunde muhasebe dongusu yavastir; 14/45 daha uygun olabilir.
      DUNNING_GUN_1: ${DUNNING_GUN_1:-3}
      DUNNING_GUN_2: ${DUNNING_GUN_2:-7}
      DUNNING_KISIT_GUNU: ${DUNNING_KISIT_GUNU:-10}
      DUNNING_GUN_3: ${DUNNING_GUN_3:-20}
      DUNNING_ASKI_GUNU: ${DUNNING_ASKI_GUNU:-30}
      # E-posta gonderici. ⚠ BOSSA DUNNING SESSIZ CALISIR: merdiven ilerler,
      # musteri kisitlanir/askiya alinir ama HICBIR UYARI ALMAZ. Canliya
      # cikmadan once doldurulmali (bkz. RAPOR).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EPOSTA_GONDEREN: ${EPOSTA_GONDEREN:-}
      # Muhasebe: "parasut" YAZMADIKCA hicbir yere fatura gitmez (sahte adaptor).
      MUHASEBE_SAGLAYICI: ${MUHASEBE_SAGLAYICI:-sahte}
      PARASUT_FIRMA_ID: ${PARASUT_FIRMA_ID:-}
      PARASUT_CLIENT_ID: ${PARASUT_CLIENT_ID:-}
      PARASUT_CLIENT_SECRET: ${PARASUT_CLIENT_SECRET:-}
      PARASUT_KULLANICI: ${PARASUT_KULLANICI:-}
      PARASUT_PAROLA: ${PARASUT_PAROLA:-}
      PORT: "3001"
      NODE_ENV: production
    expose:
      - "3001"

  frontend:
    build:
      context: ./frontend
      args:
        # Ayni domain + /api → CORS yok. Caddy /api/* i backend'e yonlendirir.
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
        # PK11: FE de kendi surumunu soyleyebilmeli (/surum.json). Backend'de
        # vardi, burada UNUTULMUSTU — 01.08 deploy'unda FE "local" dondu.
        BUILD_SHA: ${BUILD_SHA:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Gunluk otomatik yedek — host crontab GEREKMEZ (paste sorununu by-pass eder).
  # ./backups klasorune metaprice-YYYYMMDD-HHMMSS.sql.gz yazar, 14 gunden eskiyi siler.
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  dwg_cache:
