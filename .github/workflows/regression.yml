# ARINMA Faz 4 — MÜHÜR: regresyon paketi yeşil olmadan hiçbir değişiklik
# birleşmez. "Aynı işi 5 kez yapma" döngüsünü kıran kalıcı kapı.
name: regression-gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      # B1 (14.09.2026): tsconfig.json test/ dizinini dislar — testlerin tip
      # hatasi CI'da gorunmuyordu (tam-zincir.ts derlenmiyordu, test:firma kirikti).
      - name: Testlerin tip denetimi (src + test)
        run: npm run typecheck:test
      # SKIP artik basari sayilmaz: gercek SKIP kumesi regression-all.ts'teki
      # BEKLENEN_SKIP_DB_YOK defterinden saparsa paket exit 1 verir.
      # Postgres servisi YOK (karar ve gerekcesi: para dogrulugu turu raporu, B1).
      - name: Tek regresyon paketi (Z1-Z5) + SKIP defteri
        run: npm run test:regression

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx vitest run
